<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quiz — Oturumlar</title>
    <style>
        :root {
          --bg: #f5f6f8; --card: #ffffff; --text: #1d2330; --muted: #6b7280;
          --line: #e5e7eb; --accent: #2563eb; --accent-dark: #1d4ed8;
          --ok-bg: #e8f6ee; --ok: #157347; --err-bg: #fdecec; --err: #b42318;
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
               background: var(--bg); color: var(--text); }
        header { background: var(--card); border-bottom: 1px solid var(--line); padding: 16px 24px; }
        header h1 { margin: 0; font-size: 20px; }
        header p  { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
        main { max-width: 960px; margin: 24px auto; padding: 0 16px; display: grid; gap: 20px; }
        .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
        .card h2 { margin: 0 0 14px; font-size: 16px; }
        form { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; }
        input { padding: 9px 11px; border: 1px solid var(--line); border-radius: 7px; font-size: 14px; width: 100%; }
        input:focus { outline: 2px solid var(--accent); border-color: transparent; }
        button { padding: 9px 16px; border: 0; border-radius: 7px; background: var(--accent);
                 color: #fff; font-size: 14px; cursor: pointer; }
        button:hover { background: var(--accent-dark); }
        .msg { margin-top: 12px; padding: 9px 12px; border-radius: 7px; font-size: 14px; display: none; }
        .msg.ok  { display: block; background: var(--ok-bg);  color: var(--ok); }
        .msg.err { display: block; background: var(--err-bg); color: var(--err); }
        .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
        .toolbar input { max-width: 260px; }
        .count { color: var(--muted); font-size: 14px; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); }
        th { color: var(--muted); font-weight: 600; font-size: 13px; }
        tbody tr:hover { background: #f9fafb; }
        td.num { color: var(--muted); width: 60px; }
        .empty { color: var(--muted); text-align: center; padding: 24px; }
        @media (max-width: 600px) { form { grid-template-columns: 1fr; } }
    </style>
    <style>
        nav { display:flex; gap:16px; margin-top:8px; font-size:14px; }
        nav a { color: var(--accent); text-decoration:none; }
        nav a.active { font-weight:600; text-decoration:underline; }
        .toolbar label { font-size:14px; color: var(--muted); display:flex; gap:6px; align-items:center; white-space:nowrap; }
        .toolbar label input { width:auto; }
        td.q { font-weight:500; }
        td.opt { white-space:nowrap; }
        td.opt.correct { background: var(--ok-bg); color: var(--ok); font-weight:600; border-radius:6px; }
        td.ans { font-weight:600; color: var(--ok); text-align:center; }
        td.pts { text-align:center; }
        .hide-answers td.opt.correct { background:none; color:inherit; font-weight:normal; }
        .hide-answers .ans { display:none; }

        .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
        .stat { border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
        .stat .n { font-size:24px; font-weight:600; }
        .stat .l { font-size:13px; color:var(--muted); }
        .badge { display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:600; }
        .b-not_started { background:#eef0f3; color:#4b5563; }
        .b-active      { background:#e0ecff; color:#1d4ed8; }
        .b-finished    { background:var(--ok-bg); color:var(--ok); }
        .live { font-size:13px; color:var(--muted); display:flex; align-items:center; gap:6px; }
        .dot { width:8px; height:8px; border-radius:50%; background:#16a34a; animation:pulse 1.6s infinite; }
        @keyframes pulse { 50% { opacity:.3; } }
        td.muted { color:var(--muted); }
        @media (max-width:600px){ .stats{ grid-template-columns:1fr; } }
    </style>
</head>
<body>

<header>
    <h1>Quiz — Oturumlar</h1>
    <nav>
        <a href="/users">Kullanıcılar</a>
        <a href="/questions">Sorular</a>
        <a href="/sessions" class="active">Oturumlar</a>
    </nav>
</header>

<main>
    <section class="card">
        <div class="stats">
            <div class="stat"><div class="n" id="nNot">–</div><div class="l">Başlamamış</div></div>
            <div class="stat"><div class="n" id="nActive">–</div><div class="l">Sürüyor</div></div>
            <div class="stat"><div class="n" id="nFinished">–</div><div class="l">Bitmiş</div></div>
        </div>
    </section>

    <section class="card">
        <div class="toolbar">
            <h2 style="margin:0">Oturum listesi</h2>
            <span class="live"><span class="dot"></span><span id="updated">Yükleniyor…</span></span>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                <tr><th>ID</th><th>Başlık</th><th>Durum</th><th>Başlangıç</th><th>Bitiş</th><th>Süre</th></tr>
                </thead>
                <tbody id="rows">
                <tr><td colspan="6" class="empty">Yükleniyor…</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<script>
    const STATUS_TEXT = { not_started: 'Başlamadı', active: 'Sürüyor', finished: 'Bitti' };
    const REFRESH_MS = 5000;   // canlı takip: 5 saniyede bir yeniden oku

    function esc(value) {
      const div = document.createElement('div');
      div.textContent = value ?? '';
      return div.innerHTML;
    }

    // "2026-10-01 10:00:00" -> Date
    function parse(s) { return s ? new Date(s.replace(' ', 'T')) : null; }

    function duration(s) {
      const start = parse(s.startedAt);
      if (!start) return '—';
      const end = s.sessionStatus === 'finished' ? parse(s.endedAt) : new Date();
      const min = Math.max(0, Math.round((end - start) / 60000));
      if (min < 60) return min + ' dk';
      const h = Math.floor(min / 60);
      return h < 24 ? `${h} sa ${min % 60} dk` : `${Math.floor(h / 24)} gün ${h % 24} sa`;
    }

    function render(list) {
      const count = st => list.filter(s => s.sessionStatus === st).length;
      document.getElementById('nNot').textContent      = count('not_started');
      document.getElementById('nActive').textContent   = count('active');
      document.getElementById('nFinished').textContent = count('finished');

      const body = document.getElementById('rows');
      if (list.length === 0) {
        body.innerHTML = '<tr><td colspan="6" class="empty">Oturum yok</td></tr>';
        return;
      }
      body.innerHTML = list.map(s => `
        <tr>
          <td class="num">${esc(s.id)}</td>
          <td>${esc(s.title)}</td>
          <td><span class="badge b-${esc(s.sessionStatus)}">${esc(STATUS_TEXT[s.sessionStatus] ?? s.sessionStatus)}</span></td>
          <td class="${s.startedAt ? '' : 'muted'}">${esc(s.startedAt ?? '—')}</td>
          <td class="${s.endedAt ? '' : 'muted'}">${esc(s.endedAt ?? '—')}</td>
          <td>${esc(duration(s))}</td>
        </tr>`).join('');
    }

    async function loadSessions() {
      try {
        const res = await fetch('/sessionsjson');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const list = await res.json();
        list.sort((a, b) => a.id - b.id);
        render(list);
        document.getElementById('updated').textContent =
          'Son güncelleme: ' + new Date().toLocaleTimeString('tr-TR');
      } catch (e) {
        document.getElementById('updated').textContent = 'Bağlantı hatası: ' + e.message;
      }
    }

    loadSessions();
    setInterval(loadSessions, REFRESH_MS);
</script>
</body>
</html>
