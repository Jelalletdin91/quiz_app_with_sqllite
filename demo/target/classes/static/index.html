<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quiz — Kullanıcılar</title>
    <style>
        :root {
          --bg: #f5f6f8; --card: #ffffff; --text: #1d2330; --muted: #6b7280;
          --line: #e5e7eb; --accent: #2563eb; --accent-dark: #1d4ed8;
          --ok-bg: #e8f6ee; --ok: #157347; --err-bg: #fdecec; --err: #b42318;
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
               background: var(--bg); color: var(--text); }
        header { background: var(--card); border-bottom: 1px solid var(--line); padding: 16px 24px; }
        header h1 { margin: 0; font-size: 20px; }
        header p  { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
        main { max-width: 960px; margin: 24px auto; padding: 0 16px; display: grid; gap: 20px; }
        .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
        .card h2 { margin: 0 0 14px; font-size: 16px; }
        form { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; }
        input { padding: 9px 11px; border: 1px solid var(--line); border-radius: 7px; font-size: 14px; width: 100%; }
        input:focus { outline: 2px solid var(--accent); border-color: transparent; }
        button { padding: 9px 16px; border: 0; border-radius: 7px; background: var(--accent);
                 color: #fff; font-size: 14px; cursor: pointer; }
        button:hover { background: var(--accent-dark); }
        .msg { margin-top: 12px; padding: 9px 12px; border-radius: 7px; font-size: 14px; display: none; }
        .msg.ok  { display: block; background: var(--ok-bg);  color: var(--ok); }
        .msg.err { display: block; background: var(--err-bg); color: var(--err); }
        .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
        .toolbar input { max-width: 260px; }
        .count { color: var(--muted); font-size: 14px; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); }
        th { color: var(--muted); font-weight: 600; font-size: 13px; }
        tbody tr:hover { background: #f9fafb; }
        td.num { color: var(--muted); width: 60px; }
        .empty { color: var(--muted); text-align: center; padding: 24px; }
        @media (max-width: 600px) { form { grid-template-columns: 1fr; } }
        nav { display:flex; gap:16px; margin-top:8px; font-size:14px; }
        nav a { color: var(--accent); text-decoration:none; }
        nav a.active { font-weight:600; text-decoration:underline; }
    </style>
</head>
<body>

<header>
    <h1>Quiz — Kullanıcılar</h1>
    <nav>
        <a href="/users" class="active">Kullanıcılar</a>
        <a href="/questions">Sorular</a>
        <a href="/sessions">Oturumlar</a>
    </nav>
</header>

<main>

    <!-- Liste -->
    <section class="card">
        <div class="toolbar">
            <h2 style="margin:0">Kullanıcı listesi</h2>
            <span id="count" class="count"></span>
        </div>
        <div class="toolbar">
            <input id="search" placeholder="Ara: kullanıcı adı veya ad soyad">
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                <tr><th>ID</th><th>Kullanıcı adı</th><th>Ad soyad</th><th>Kayıt zamanı</th></tr>
                </thead>
                <tbody id="rows">
                <tr><td colspan="4" class="empty">Yükleniyor…</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<script>
    let allUsers = [];

    // HTML'e güvenli yazmak için (XSS önleme)
    function esc(value) {
      const div = document.createElement('div');
      div.textContent = value ?? '';
      return div.innerHTML;
    }

    function render() {
      const q = document.getElementById('search').value.trim().toLowerCase();
      const list = allUsers.filter(u =>
        (u.userName ?? '').toLowerCase().includes(q) ||
        (u.fullName ?? '').toLowerCase().includes(q));

      document.getElementById('count').textContent =
        `${list.length} / ${allUsers.length} kullanıcı`;

      const body = document.getElementById('rows');
      if (list.length === 0) {
        body.innerHTML = '<tr><td colspan="4" class="empty">Kayıt bulunamadı</td></tr>';
        return;
      }
      body.innerHTML = list.map(u => `
        <tr>
          <td class="num">${esc(u.id)}</td>
          <td>${esc(u.userName)}</td>
          <td>${esc(u.fullName)}</td>
          <td>${esc(u.createdAt)}</td>
        </tr>`).join('');
    }

    async function loadUsers() {
      try {
        const res = await fetch('/usersjson');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        allUsers = await res.json();
        render();
      } catch (e) {
        document.getElementById('rows').innerHTML =
          `<tr><td colspan="4" class="empty">Kullanıcılar yüklenemedi: ${esc(e.message)}</td></tr>`;
      }
    }

    document.getElementById('search').addEventListener('input', render);

    loadUsers();
</script>
</body>
</html>
